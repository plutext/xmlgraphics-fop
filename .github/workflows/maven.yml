# docx4j-fo-renderer: Apache FOP's own CI (build, checkstyle, spotbugs), on the fork's branch.
#
# Keep these branch lists in step with the fork's branch, named in CLAUDE.md. 2.11-docx4j.2
# is where work happens; docx4j-2.11 is frozen and identifies the 2.11-docx4j.1 release, and
# is listed only so an accidental push there is still checked. A stale list here fails
# silently: no runs at all reads the same as no failures.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "2.11-docx4j.3", "2.11-docx4j.2", "docx4j-2.11" ]
  pull_request:
    branches: [ "2.11-docx4j.3", "2.11-docx4j.2", "docx4j-2.11" ]

jobs:
  build:
    name: Test with Java ${{ matrix.jdk }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '17', '21']
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package checkstyle:check spotbugs:check --file pom.xml
